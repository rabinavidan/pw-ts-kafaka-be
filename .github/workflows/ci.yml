name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  KAFKA_BROKERS: localhost:9092
  API_BASE_URL: http://localhost:3000

jobs:
  # ── 1. Lint & type-check ─────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ── 2. UI build ──────────────────────────────────────────────────
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run ui:install
      - run: npm run ui:build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  # ── 3. Backend tests (API + Kafka + Integration) ─────────────────
  test-be:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mockuser
          POSTGRES_PASSWORD: mockpass
          POSTGRES_DB: mockdb
        options: >-
          --health-cmd "pg_isready -U mockuser -d mockdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "nc -z localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema
        run: psql -h localhost -U mockuser -d mockdb -f db/init.sql
        env:
          PGPASSWORD: mockpass

      - name: Create Kafka topics
        run: |
          for topic in orders payments notifications dead-letter-queue audit-events; do
            docker run --rm --network host confluentinc/cp-kafka:7.6.0 \
              kafka-topics --bootstrap-server localhost:9092 \
              --create --if-not-exists --topic $topic \
              --partitions 3 --replication-factor 1
          done

      - name: Run backend tests
        run: npx playwright test --project=api --project=kafka --project=integration
        env:
          CI: true
          KAFKA_BROKERS: ${{ env.KAFKA_BROKERS }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          PORT: 3000
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass

      - name: Generate HTML report
        if: always()
        run: node generate-report.js

      - name: Write job summary
        if: always()
        run: node generate-summary.js test-results/results.json >> $GITHUB_STEP_SUMMARY
        env:
          SUMMARY_LABEL: Backend Tests — API · Kafka · Integration

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload pretty HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-test-report-html
          path: test-report.html
          retention-days: 30

      - name: Upload results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-results-json
          path: test-results/results.json
          retention-days: 30

  # ── 4. Microservices stack (gateway + orders/payments/events/notifications) ──
  test-microservices:
    name: Microservices Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mockuser
          POSTGRES_PASSWORD: mockpass
          POSTGRES_DB: mockdb
        options: >-
          --health-cmd "pg_isready -U mockuser -d mockdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "nc -z localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema
        run: psql -h localhost -U mockuser -d mockdb -f db/init.sql
        env:
          PGPASSWORD: mockpass

      - name: Create Kafka topics
        run: |
          for topic in orders payments notifications dead-letter-queue audit-events; do
            docker run --rm --network host confluentinc/cp-kafka:7.6.0 \
              kafka-topics --bootstrap-server localhost:9092 \
              --create --if-not-exists --topic $topic \
              --partitions 3 --replication-factor 1
          done

      - name: Start microservices stack
        run: |
          npm run dev:services > /tmp/microservices.log 2>&1 &
          disown
        env:
          KAFKA_BROKERS: ${{ env.KAFKA_BROKERS }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass

      - name: Wait for microservices to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:3000/health | node -pe "try{JSON.parse(require('fs').readFileSync(0)).status}catch{'unreachable'}" 2>/dev/null || echo unreachable)
            if [ "$STATUS" = "healthy" ]; then
              echo "Microservices stack is healthy"
              exit 0
            fi
            echo "Waiting for microservices stack... ($i/30, status=$STATUS)"
            sleep 2
          done
          echo "Microservices stack did not become healthy in time"
          curl -s http://localhost:3000/health || true
          exit 1

      - name: Run microservices tests
        run: npm run test:microservices
        env:
          CI: true
          KAFKA_BROKERS: ${{ env.KAFKA_BROKERS }}
          API_BASE_URL: http://localhost:3000
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass

      - name: Write job summary
        if: always()
        run: node generate-summary.js test-results/results.json >> $GITHUB_STEP_SUMMARY
        env:
          SUMMARY_LABEL: Microservices Tests — gateway · orders · payments · events · notifications

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-results-json
          path: test-results/results.json
          retention-days: 30

      - name: Upload microservices log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-log
          path: /tmp/microservices.log
          retention-days: 7

  # ── 5. DB layer tests (pure PostgreSQL — no API, no Kafka) ─────────
  test-db:
    name: DB Layer Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mockuser
          POSTGRES_PASSWORD: mockpass
          POSTGRES_DB: mockdb
        options: >-
          --health-cmd "pg_isready -U mockuser -d mockdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema
        run: psql -h localhost -U mockuser -d mockdb -f db/init.sql
        env:
          PGPASSWORD: mockpass

      - name: Run DB layer tests
        run: npm run test:db
        env:
          CI: true
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass
          PORT: 3001
          API_BASE_URL: http://localhost:3001

      - name: Write job summary
        if: always()
        run: node generate-summary.js test-results/results.json >> $GITHUB_STEP_SUMMARY
        env:
          SUMMARY_LABEL: DB Layer Tests — orders · payments · event_log · kafka_consumer_offsets

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-results-json
          path: test-results/results.json
          retention-days: 30

  # ── 6. E2E tests (UI — Orders & Payments) ────────────────────────
  test-e2e:
    name: E2E Tests (UI)
    runs-on: ubuntu-latest
    needs: [lint, ui-build]

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mockuser
          POSTGRES_PASSWORD: mockpass
          POSTGRES_DB: mockdb
        options: >-
          --health-cmd "pg_isready -U mockuser -d mockdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "nc -z localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm run ui:install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema
        run: psql -h localhost -U mockuser -d mockdb -f db/init.sql
        env:
          PGPASSWORD: mockpass

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          KAFKA_BROKERS: ${{ env.KAFKA_BROKERS }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass

      - name: Stage E2E report artifacts
        # Both Playwright configs default outputDir to test-results/, which
        # is wiped at the start of every run — stage outside it so the next
        # invocation (UI smoke) doesn't delete these.
        if: always()
        run: |
          mkdir -p report-artifacts
          [ -d playwright-report-ui ] && mv playwright-report-ui report-artifacts/playwright-report-ui-e2e || true
          [ -f test-results/ui-results.json ] && mv test-results/ui-results.json report-artifacts/ui-e2e-results.json || true

      - name: Run UI smoke tests
        if: always()
        run: npm run test:ui-smoke
        env:
          CI: true
          KAFKA_BROKERS: ${{ env.KAFKA_BROKERS }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mockdb
          PGUSER: mockuser
          PGPASSWORD: mockpass

      - name: Stage UI smoke report artifacts
        if: always()
        run: |
          mkdir -p report-artifacts
          [ -d playwright-report-ui ] && mv playwright-report-ui report-artifacts/playwright-report-ui-smoke || true
          [ -f test-results/ui-results.json ] && mv test-results/ui-results.json report-artifacts/ui-smoke-results.json || true

      - name: Write job summary
        if: always()
        run: node generate-summary.js report-artifacts/ui-e2e-results.json report-artifacts/ui-smoke-results.json >> $GITHUB_STEP_SUMMARY
        env:
          SUMMARY_LABEL: E2E Tests — Orders · Payments · UI Smoke

      - name: Upload E2E Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-report
          path: report-artifacts/playwright-report-ui-e2e/
          retention-days: 30

      - name: Upload UI smoke Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-playwright-report
          path: report-artifacts/playwright-report-ui-smoke/
          retention-days: 30

      - name: Upload E2E results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-json
          path: report-artifacts/ui-e2e-results.json
          retention-days: 30

      - name: Upload UI smoke results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-results-json
          path: report-artifacts/ui-smoke-results.json
          retention-days: 30

  # ── 7. Coverage — aggregate pass-rate across all test layers ─────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-be, test-microservices, test-db, test-e2e]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results-json'
          path: artifacts

      - name: Aggregate coverage and gate on pass rate
        run: |
          node generate-coverage.js \
            artifacts/be-results-json/results.json \
            artifacts/microservices-results-json/results.json \
            artifacts/db-results-json/results.json \
            artifacts/e2e-results-json/ui-e2e-results.json \
            artifacts/ui-smoke-results-json/ui-smoke-results.json \
            --out=badges/tests.json \
            --breakdown=badges/coverage.json \
            --threshold=100 | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload coverage badges
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badges
          path: badges/
          retention-days: 30

  # ── 8. Deploy to GitHub Pages (main only) ────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-be, test-microservices, test-db, test-e2e, ui-build, coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: dist/

      - name: Download BE pretty HTML report
        uses: actions/download-artifact@v4
        with:
          name: be-test-report-html
          path: dist/reports/

      - name: Download per-layer Playwright HTML reports
        uses: actions/download-artifact@v4
        with:
          path: dist/reports/
          pattern: '*-playwright-report'

      - name: Download coverage badges
        uses: actions/download-artifact@v4
        with:
          name: coverage-badges
          path: dist/badges/

      - name: Rename report folders to short layer names
        run: |
          cd dist/reports
          [ -d be-playwright-report ]            && mv be-playwright-report be
          [ -d microservices-playwright-report ] && mv microservices-playwright-report microservices
          [ -d db-playwright-report ]            && mv db-playwright-report db
          [ -d e2e-playwright-report ]           && mv e2e-playwright-report e2e
          [ -d ui-smoke-playwright-report ]      && mv ui-smoke-playwright-report ui-smoke
          true

      - name: Generate live report landing page
        run: node generate-report-index.js dist/badges/coverage.json dist/reports/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
