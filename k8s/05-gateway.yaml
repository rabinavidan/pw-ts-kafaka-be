apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pw-kafka-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        role: app              # → desktop-worker2
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: pw-kafka-test
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300     # same external port — API_BASE_URL unchanged
      name: http
