apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: pw-kafka-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      nodeSelector:
        role: app              # → desktop-worker2
      containers:
        - name: ui
          image: pw-kafka-ui:latest
          imagePullPolicy: Never   # image loaded into kind via: kind load docker-image pw-kafka-ui:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-svc
  namespace: pw-kafka-test
  labels:
    app: ui
spec:
  selector:
    app: ui
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
