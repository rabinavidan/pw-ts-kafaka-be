apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pw-kafka-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      nodeSelector:
        role: app              # → desktop-worker2
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
              name: health
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: NOTIFICATIONS_HEALTH_PORT
              value: "3004"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGPASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "96Mi"
              cpu: "80m"
            limits:
              memory: "192Mi"
              cpu: "300m"
