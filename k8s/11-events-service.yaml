apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: pw-kafka-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
    spec:
      nodeSelector:
        role: app              # → desktop-worker2
      containers:
        - name: events-service
          image: events-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: EVENTS_PORT
              value: "3003"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGPASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: events-svc
  namespace: pw-kafka-test
  labels:
    app: events-service
spec:
  selector:
    app: events-service
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
      name: http
