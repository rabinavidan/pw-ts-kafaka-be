apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: pw-kafka-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      nodeSelector:
        role: app              # → desktop-worker2
      containers:
        - name: orders-service
          image: orders-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: ORDERS_PORT
              value: "3001"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGPASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "96Mi"
              cpu: "80m"
            limits:
              memory: "192Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: pw-kafka-test
  labels:
    app: orders-service
spec:
  selector:
    app: orders-service
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
